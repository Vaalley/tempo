services:
    # --- BASES DE DONNÉES ---
    postgres:
        image: postgres:18-alpine
        container_name: tempo_postgres
        restart: always
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: password123
            POSTGRES_DB: tempo_db
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql

    mongo:
        image: mongo:8-noble
        container_name: tempo_mongo
        restart: always
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: password123
        ports:
            - '27017:27017'
        volumes:
            - mongo_data:/data/db

    # --- BACKEND (Hono) ---
    backend:
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
        container_name: tempo_backend
        restart: always
        ports:
            - '3000:3000'
        environment:
            DATABASE_URL: 'postgres://admin:password123@postgres:5432/tempo_db'
            MONGO_URL: 'mongodb://admin:password123@mongo:27017'
            MONGO_DB_NAME: 'tempo_audit'
        depends_on:
            - postgres
            - mongo

    # --- FRONTEND (Svelte) ---
    frontend:
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile
        container_name: tempo_frontend
        restart: always
        ports:
            - '5173:3000'
        environment:
            PUBLIC_API_URL: 'http://localhost:3000'
        depends_on:
            - backend

volumes:
    postgres_data:
    mongo_data:
