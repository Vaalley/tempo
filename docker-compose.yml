services:
    # --- BASES DE DONNÉES ---
    postgres:
        image: postgres:18-alpine
        container_name: tempo_postgres
        restart: always
        environment:
            POSTGRES_USER: '${POSTGRES_USER:?POSTGRES_USER is required}'
            POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
            POSTGRES_DB: '${POSTGRES_DB:?POSTGRES_DB is required}'
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql

    mongo:
        image: mongo:8-noble
        container_name: tempo_mongo
        restart: always
        environment:
            MONGO_INITDB_ROOT_USERNAME: '${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}'
            MONGO_INITDB_ROOT_PASSWORD: '${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}'
        ports:
            - '27017:27017'
        volumes:
            - mongo_data:/data/db

    # --- BACKEND (Hono) ---
    backend:
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
        container_name: tempo_backend
        restart: always
        ports:
            - '3000:3000'
        environment:
            DATABASE_URL: '${DATABASE_URL:?DATABASE_URL is required}'
            MONGO_URL: '${MONGO_URL:?MONGO_URL is required}'
            MONGO_DB_NAME: '${MONGO_DB_NAME:?MONGO_DB_NAME is required}'
            JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is required}'
        depends_on:
            - postgres
            - mongo

    # --- FRONTEND (Svelte) ---
    frontend:
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile
        container_name: tempo_frontend
        restart: always
        ports:
            - '5173:3000'
        environment:
            PUBLIC_API_URL: '${PUBLIC_API_URL:?PUBLIC_API_URL is required}'
        depends_on:
            - backend

volumes:
    postgres_data:
    mongo_data:
