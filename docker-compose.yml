services:
    # --- BASES DE DONNÉES ---
    postgres:
        image: postgres:18.6-alpine3.24
        container_name: tempo_postgres
        restart: always
        environment:
            POSTGRES_USER: '${POSTGRES_USER:?POSTGRES_USER is required}'
            POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
            POSTGRES_DB: '${POSTGRES_DB:?POSTGRES_DB is required}'
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    mongo:
        image: mongo:8.0.29-noble
        container_name: tempo_mongo
        restart: always
        environment:
            MONGO_INITDB_ROOT_USERNAME: '${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}'
            MONGO_INITDB_ROOT_PASSWORD: '${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}'
            MONGO_DB_NAME: '${MONGO_DB_NAME:?MONGO_DB_NAME is required}'
        ports:
            - '27017:27017'
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"',
                ]
            interval: 5s
            timeout: 10s
            retries: 10
            start_period: 15s

    # --- BACKEND (Hono) ---
    backend:
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
        container_name: tempo_backend
        restart: always
        ports:
            - '3000:3000'
        environment:
            DATABASE_URL: '${DATABASE_URL:?DATABASE_URL is required}'
            MONGO_URL: '${MONGO_URL:?MONGO_URL is required}'
            MONGO_DB_NAME: '${MONGO_DB_NAME:?MONGO_DB_NAME is required}'
            JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is required}'
            FRONTEND_ORIGIN: '${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}'
            AUTH_RATE_LIMIT_MAX: '${AUTH_RATE_LIMIT_MAX:-10}'
            AUTH_RATE_LIMIT_WINDOW_MS: '${AUTH_RATE_LIMIT_WINDOW_MS:-900000}'
            TRUST_PROXY: '${TRUST_PROXY:-false}'
        depends_on:
            postgres:
                condition: service_healthy
            mongo:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'bun',
                    '-e',
                    "const response = await fetch('http://localhost:3000/health'); if (!response.ok) process.exit(1)",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 15s

    # --- FRONTEND (Svelte) ---
    frontend:
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile
        container_name: tempo_frontend
        restart: always
        ports:
            - '5173:3000'
        environment:
            PUBLIC_API_URL: '${PUBLIC_API_URL:?PUBLIC_API_URL is required}'
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'bun',
                    '-e',
                    "const response = await fetch('http://localhost:3000/'); if (!response.ok) process.exit(1)",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    # --- OPTIONAL REPRODUCIBLE DEMO DATA ---
    seed:
        profiles: ['demo']
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
        environment:
            DATABASE_URL: '${DATABASE_URL:?DATABASE_URL is required}'
            DEMO_ADMIN_EMAIL: '${DEMO_ADMIN_EMAIL:-}'
            DEMO_ADMIN_PASSWORD: '${DEMO_ADMIN_PASSWORD:-}'
            DEMO_USER_EMAIL: '${DEMO_USER_EMAIL:-}'
            DEMO_USER_PASSWORD: '${DEMO_USER_PASSWORD:-}'
        command: ['bun', 'run', 'src/db/seed.ts']
        depends_on:
            postgres:
                condition: service_healthy
        restart: 'no'

volumes:
    postgres_data:
    mongo_data:
