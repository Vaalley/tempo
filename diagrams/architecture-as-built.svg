<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" aria-labelledby="title description" role="img" viewBox="0 0 1500 720"><title id="title">Architecture 3-tiers implémentée de Tempo</title><desc id="description">Le navigateur utilise le frontend SvelteKit, qui appelle l&apos;API Hono sécurisée. Les services métier accèdent à PostgreSQL avec Drizzle et à MongoDB pour les logs d&apos;audit.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#475569" d="M0,0 L0,6 L9,3 z"/></marker><style>.tier-title,.title{fill:#0f172a}.title{font:700 30px Arial,sans-serif}.tier-title{font:700 22px Arial,sans-serif}.label{font:600 17px Arial,sans-serif;fill:#1e293b}.body{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#475569}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1500" height="720" fill="#fff"/><text x="750" y="48" class="title" text-anchor="middle">Tempo, architecture 3-tiers implémentée (V1)</text><circle cx="74" cy="330" r="24" fill="#f8fafc" stroke="#475569" stroke-width="3"/><path fill="none" stroke="#475569" stroke-width="3" d="M74 354 L74 430 M32 390 L116 390 M74 430 L40 480 M74 430 L108 480"/><text x="74" y="520" class="label" text-anchor="middle">Utilisateur</text><text x="74" y="544" class="small" text-anchor="middle">USER ou ADMIN</text><rect width="370" height="500" x="180" y="105" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" rx="20"/><text x="365" y="145" class="tier-title" text-anchor="middle">Couche présentation</text><text x="365" y="172" class="body" text-anchor="middle">SvelteKit 2.63.1 et Svelte 5.56.3</text><rect width="290" height="95" x="220" y="210" fill="#fff" stroke="#38bdf8" stroke-width="2" rx="12"/><text x="365" y="244" class="label" text-anchor="middle">Pages SvelteKit</text><text x="365" y="269" class="body" text-anchor="middle">/, /login, /bookings, /check-in,</text><text x="365" y="292" class="body" text-anchor="middle">/admin/*</text><rect width="290" height="105" x="220" y="340" fill="#fff" stroke="#38bdf8" stroke-width="2" rx="12"/><text x="365" y="375" class="label" text-anchor="middle">Navigation et appels API</text><text x="365" y="403" class="body" text-anchor="middle">gardes partagées et client Hono RPC typé</text><rect width="290" height="75" x="220" y="480" fill="#fff" stroke="#38bdf8" stroke-width="2" rx="12"/><text x="365" y="512" class="label" text-anchor="middle">Authentification</text><text x="365" y="538" class="body" text-anchor="middle">JWT conservé dans localStorage</text><rect width="400" height="500" x="620" y="105" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" rx="20"/><text x="820" y="145" class="tier-title" text-anchor="middle">Couche métier et API</text><text x="820" y="172" class="body" text-anchor="middle">Bun 1.3.14 et Hono 4.12.24</text><rect width="320" height="105" x="660" y="205" fill="#fff" stroke="#a78bfa" stroke-width="2" rx="12"/><text x="820" y="238" class="label" text-anchor="middle">Middlewares</text><text x="820" y="266" class="body" text-anchor="middle">CORS, en-têtes, rate limiting,</text><text x="820" y="289" class="body" text-anchor="middle">gardes JWT et ADMIN</text><rect width="320" height="95" x="660" y="345" fill="#fff" stroke="#a78bfa" stroke-width="2" rx="12"/><text x="820" y="378" class="label" text-anchor="middle">Routes HTTP</text><text x="820" y="406" class="body" text-anchor="middle">auth, users, workspaces, bookings,</text><text x="820" y="429" class="body" text-anchor="middle">participants, check-in, analytics et audit</text><rect width="320" height="80" x="660" y="475" fill="#fff" stroke="#a78bfa" stroke-width="2" rx="12"/><text x="820" y="509" class="label" text-anchor="middle">Services métier</text><text x="820" y="536" class="body" text-anchor="middle">logique applicative et accès aux données</text><rect width="360" height="500" x="1090" y="105" fill="#dcfce7" stroke="#16a34a" stroke-width="3" rx="20"/><text x="1270" y="145" class="tier-title" text-anchor="middle">Couche persistance</text><rect width="280" height="130" x="1130" y="215" fill="#fff" stroke="#4ade80" stroke-width="2" rx="12"/><ellipse cx="1270" cy="245" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" rx="105" ry="20"/><text x="1270" y="251" class="label" text-anchor="middle">PostgreSQL 18.6</text><text x="1270" y="291" class="body" text-anchor="middle">utilisateurs, espaces, réservations,</text><text x="1270" y="314" class="body" text-anchor="middle">participants et jetons QR hachés</text><text x="1270" y="337" class="body" text-anchor="middle">Drizzle, contraintes et index</text><rect width="280" height="120" x="1130" y="405" fill="#fff" stroke="#4ade80" stroke-width="2" rx="12"/><ellipse cx="1270" cy="435" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" rx="105" ry="20"/><text x="1270" y="441" class="label" text-anchor="middle">MongoDB 8.0.29</text><text x="1270" y="484" class="body" text-anchor="middle">logs de suppression</text><text x="1270" y="509" class="body" text-anchor="middle">écriture best effort</text><path d="M120 390 L210 390" class="arrow"/><text x="165" y="374" class="small" text-anchor="middle">navigateur</text><path d="M510 390 L650 390" class="arrow"/><text x="580" y="355" class="small" text-anchor="middle">HTTP JSON</text><text x="580" y="376" class="small" text-anchor="middle">Bearer JWT</text><path d="M980 495 C1040 495 1050 280 1130 280" class="arrow"/><text x="1058" y="323" class="small" text-anchor="middle">Drizzle / SQL</text><path d="M980 520 C1040 520 1050 465 1130 465" class="arrow"/><text x="1054" y="495" class="small" text-anchor="middle">pilote MongoDB</text><rect width="590" height="48" x="455" y="642" fill="#f8fafc" stroke="#cbd5e1" rx="10"/><text x="750" y="672" class="body" text-anchor="middle">Architecture V1 observée dans le code. Il n’existe pas de couche Repository distincte.</text></svg>