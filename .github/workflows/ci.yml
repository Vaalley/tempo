name: Tempo CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    # JOB 1: Code Quality & Logic
    quality:
        name: 🛡️ Quality & Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Check Formatting (Oxfmt)
              run: bun run format:check

            - name: Lint Code (Oxlint)
              run: bun run lint

            - name: Check TypeScript and Svelte
              run: bun run typecheck

            - name: Run Tests
              run: bun run test

            - name: Build Applications
              run: bun run build

    # JOB 2: Build Verification
    integration-e2e:
        name: 🐳 Docker Build Check
        needs: quality # Only runs if Quality passes
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install Test Dependencies
              run: bun install --frozen-lockfile

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Configure Test Environment
              run: cp .env.example .env

            - name: Validate Docker Compose
              run: docker compose config --quiet

            - name: Build and Start the Stack
              run: docker compose up --build --detach --wait --wait-timeout 240

            - name: Load Reproducible Demo Data
              run: docker compose --profile demo run --build --rm seed

            - name: Run PostgreSQL Integration Tests
              run: docker compose exec --no-TTY backend bun run test:integration:postgres

            - name: Run MongoDB Integration Tests
              run: docker compose exec --no-TTY backend bun run test:integration:mongo

            - name: Run Browser End-to-End Test
              run: npx playwright test

            - name: Verify Public Endpoints
              run: |
                  curl --fail --silent http://localhost:3000/health
                  curl --fail --silent http://localhost:5173/ > /dev/null
                  curl --fail --silent \
                    --header 'Content-Type: application/json' \
                    --data '{"email":"admin@tempo.test","password":"change-me-demo-admin"}' \
                    http://localhost:3000/auth/login > /dev/null

            - name: Show Container Logs on Failure
              if: failure()
              run: docker compose logs --no-color

            - name: Upload Playwright Report on Failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Stop the Stack
              if: always()
              run: docker compose down --volumes --remove-orphans
